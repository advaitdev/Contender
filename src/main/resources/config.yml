lobby:
  # Use /setlobby to save the world, coordinates and facing together.
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  # These settings can also be changed in /options > Lobby Settings.
  teleport-on-join: true
  # Breaking blocks and collecting fluids with buckets, in the lobby and every other world outside a game.
  # Players in a match or minigame follow its kit's Break Blocks setting instead.
  allow-block-break: false
  # Placing blocks and emptying buckets, with the same scope (games follow the kit's Place Blocks setting).
  allow-block-place: false
  # Players with contender.admin can build even when the options above are blocked.
  admin-build-bypass: true

arenas:
  world: "contender_arenas"
  copies-per-map: 20
  # Distance between arena slots, in blocks. Leave this unchanged after preparing maps.
  spacing: 1024
  # Maximum selected volume per map, including air.
  max-template-blocks: 100000000

matches:
  # How long a match waits for a player who disconnects before they forfeit the round.
  reconnect-seconds: 60

spectators:
  # Show a small allay where each spectator is, so players can see who's watching.
  # Allays are hidden from fighters close by and in kits marked as spectator-invisible.
  allay-avatars: true

display:
  # Colors for boards, holograms, vote numbers and fireworks.
  # ocean, amethyst, sunset, gold, mint, crimson, frost or mono. Change this in /options > Display Colors.
  theme: ocean
  # Hide "Advancement Made" and "New Recipes Unlocked" pop-ups, which appear whenever a kit is handed out.
  hide-advancement-toasts: true

voice:
  # Directors can be heard by everyone, wherever they are (needs Simple Voice Chat).
  # Change this in /options > Chat & Voice.
  director-broadcast: false

# Saved by commands; there's no need to edit these by hand:
#   /setinterviewerposition and /setintervieweeposition save interview positions
#   /setvotestage saves where players gather when votes are revealed
#   /votetimer saves where the vote countdown appears

nametags:
  roles:
    director:
      prefix: "[Director]"
      color: gold
    spectator:
      prefix: "[Spectator]"
      color: gray

# A blank title follows the current tournament name.
tablist:
  enabled: true
  title: ""
  color: gold

# 0 is transparent; 100 is solid. Change this in /options > Board Background.
tournament-board:
  background-opacity: 30
