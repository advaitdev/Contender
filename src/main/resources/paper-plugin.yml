name: Contender
version: '${project.version}'
main: me.advait.contender.Contender
bootstrapper: me.advait.contender.ContenderBootstrap
api-version: '26.2'
dependencies:
  server:
    FastAsyncWorldEdit:
      load: BEFORE
      required: true
      join-classpath: true
    voicechat:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  contender.master:
    description: Run events and use every director tool
    default: op
  contender.admin:
    description: Lobby, chat and PvP settings, and admin bypasses
    default: op
