name: Contender
version: '${project.version}'
main: me.advait.contender.Contender
api-version: '26.2'
depend: [FastAsyncWorldEdit]
softdepend: [voicechat]
commands:
  tournament:
    description: "Run the show: events, matches, setup tools and hacker controls"
    permission: contender.master
    usage: "/tournament"
  duel:
    description: "Start a one-off match"
    permission: contender.master
    usage: "/duel"
  arena:
    description: "Save maps and set their spawns"
    permission: contender.master
    usage: "/arena"
  spectate:
    description: "Watch a match or minigame"
    usage: "/spectate"
  lobby:
    description: "Return to the lobby"
    usage: "/lobby"
  setlobby:
    description: "Set the lobby to where you stand"
    permission: contender.master
    usage: "/setlobby"
  bracket:
    description: "Choose what the tab list shows"
    usage: "/bracket"
  options:
    description: "Settings"
    usage: "/options"
  role:
    description: "Make a player a director, spectator or contestant"
    permission: contender.master
    usage: "/role [player] [director|spectator|contestant]"
  tier:
    description: "Look up a player's MCTiers rankings"
    usage: "/tier [player]"
  vote:
    description: "Vote, or see the vote"
    usage: "/vote [number]"
  startvote:
    description: "Start a community vote"
    permission: contender.master
    usage: "/startvote [seconds] [live] [quick] [eliminate]"
  endvote:
    description: "Close the vote and show the results"
    permission: contender.master
    usage: "/endvote"
  votetimer:
    description: "Place or remove the vote timer"
    permission: contender.master
    usage: "/votetimer [remove]"
  setvotestage:
    description: "Set where candidates gather for the vote results"
    permission: contender.master
    usage: "/setvotestage [remove]"
  hacks:
    description: "See or change your hacks"
    usage: "/hacks"
  hackers:
    description: "Pick the hackers and control their hacks and sabotages"
    permission: contender.master
    usage: "/hackers"
  pickhacker:
    description: "Pick the hackers by name"
    permission: contender.master
    usage: "/pickhacker <name> [name ...] or /pickhacker --clear"
  sabotage:
    description: "Trigger a sabotage"
    usage: "/sabotage"
  interview:
    description: "Bring a player into the interview room"
    permission: contender.master
    usage: "/interview <player>"
  uninterview:
    description: "End the interview and send everyone back"
    permission: contender.master
    usage: "/uninterview"
  setinterviewerposition:
    description: "Set your spot in the interview room"
    permission: contender.master
    usage: "/setinterviewerposition"
  setintervieweeposition:
    description: "Set the interviewed player's spot"
    permission: contender.master
    usage: "/setintervieweeposition"
  endduel:
    description: "End a match now with its current score"
    permission: contender.master
    usage: "/endduel [player]"
  cancelduel:
    description: "Cancel a match without recording a result"
    permission: contender.master
    usage: "/cancelduel [player]"
  cancelall:
    description: "Stop every event, match, vote and interview"
    permission: contender.master
    usage: "/cancelall"
  contender:
    description: "Status, reload and voice checks"
    permission: contender.master
    usage: "/contender [status|reload|voice]"
permissions:
  contender.master:
    description: "Run events and use every director tool"
    default: op
  contender.admin:
    description: "Lobby, chat and PvP settings, and admin bypasses"
    default: op
