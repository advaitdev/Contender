name: Contender
version: '${project.version}'
main: me.advait.contender.Contender
api-version: '26.2'
depend: [FastAsyncWorldEdit]
softdepend: [voicechat]
commands:
  votetimer:
    description: Place or remove the vote timer
    usage: /votetimer [remove]
    permission: contender.master
  hacks:
    description: Configure your hacker abilities
    usage: /hacks
  pickhacker:
    description: Select the hackers and announce their teammates privately
    permission: contender.master
    usage: /pickhacker <name> [name ...] or /pickhacker --clear
  setlobby:
    description: Set the lobby return location
    permission: contender.master
    usage: /setlobby
  lobby:
    description: Return to the lobby
    usage: /lobby
  bracket:
    description: Choose tab rounds, pages and standings
    usage: /bracket
  role:
    description: Assign director, spectator, or contestant roles
    permission: contender.master
    usage: /role [player] [director|spectator|contestant]
  tier:
    description: Look up a player's MCTiers rankings
    usage: /tier [player]
  arena:
    description: Create maps and prepare arena copies
    permission: contender.master
    usage: /arena
  tournament:
    description: Set up a round-robin tournament
    permission: contender.master
    usage: /tournament
  spectate:
    description: Choose a match to watch
    usage: /spectate
  duel:
    description: Open the duel setup menu
    permission: contender.master
    usage: /duel
  contender:
    description: Contender admin commands
    permission: contender.master
    usage: /contender <reload>
  cancelduel:
    description: Cancel a player's duel without recording a result
    permission: contender.master
    usage: /cancelduel [player]
  cancelall:
    description: Force cancel all events, duels, and votes
    permission: contender.master
    usage: /cancelall
  endduel:
    description: End the duel you are currently in
    permission: contender.master
    usage: /endduel
  startvote:
    description: Start a community vote
    permission: contender.master
    usage: /startvote <seconds>
  endvote:
    description: End the current community vote
    permission: contender.master
    usage: /endvote
  vote:
    description: Open the voting GUI
    usage: /vote
  options:
    description: Open settings and configure role nametags
    usage: /options
permissions:
  contender.master:
    description: Allows access to duel management
    default: op
  contender.admin:
    description: Allows lobby, chat, voice and PvP settings, and configured admin bypasses
    default: op
