name: Contender
version: '${project.version}'
main: me.advait.contender.Contender
api-version: '26.2'
depend: [FastAsyncWorldEdit]
softdepend: [LibsDisguises, voicechat]
commands:
  role:
    description: Assign director, spectator, or contestant roles
    permission: contender.master
    usage: /role [player] [director|spectator|contestant]
  tier:
    description: Look up a player's MCTiers rankings
    usage: /tier [player]
  arena:
    description: Create maps and prepare arena copies
    permission: contender.master
    usage: /arena
  tournament:
    description: Set up a round-robin tournament
    permission: contender.master
    usage: /tournament
  spectate:
    description: Choose a match to watch
    usage: /spectate
  duel:
    description: Open the duel setup menu
    permission: contender.master
    usage: /duel
  contender:
    description: Contender admin commands
    permission: contender.master
    usage: /contender <reload>
  endduel:
    description: End the duel you are currently in
    permission: contender.master
    usage: /endduel
  startvote:
    description: Start a community vote
    permission: contender.master
    usage: /startvote <seconds>
  endvote:
    description: End the current community vote
    permission: contender.master
    usage: /endvote
  vote:
    description: Open the voting GUI
    usage: /vote
  deceased:
    description: Manage deceased players
    permission: contender.master
    usage: /deceased <add|remove|list> [player]
  settings:
    description: Open settings and configure role nametags
    usage: /settings
permissions:
  contender.master:
    description: Allows access to duel management
    default: op
  contender.admin:
    description: Allows access to admin settings (chat/voice configuration)
    default: op
